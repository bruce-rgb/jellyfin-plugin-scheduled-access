<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Scheduled Access</title>
</head>
<body>
    <div id="ScheduledAccessConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="ScheduledAccessConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="Enabled" name="Enabled" type="checkbox" is="emby-checkbox" />
                            <span data-localize="EnableLabel">Enable day-of-week restrictions</span>
                        </label>
                        <div class="fieldDescription" data-localize="EnableDescription">
                            While disabled, the next task run restores every affected user's original tags.
                        </div>
                    </div>

                    <h3 data-localize="Rules">Rules</h3>
                    <div class="fieldDescription" style="margin-bottom:1em;" data-localize="RulesDescription">
                        Each rule applies to one user on the days you check. Tags are inherited from parent
                        folders and collections, so you can tag a whole folder instead of item by item.
                    </div>

                    <div id="RulesContainer"></div>

                    <button is="emby-button" type="button" id="AddRule" class="raised block emby-button">
                        <span data-localize="AddRule">Add rule</span>
                    </button>

                    <br />
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span data-localize="Save">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            (function () {
                var pluginUniqueId = '65e8ae1e-ea44-4b8c-a2c7-16f46a158eb4';

                // Debe coincidir con Plugin.SupportedLanguages. El primero es
                // el idioma de respaldo y el que ya lleva el HTML escrito.
                var SUPPORTED = ['en', 'es'];

                var DAY_KEYS = [
                    ['Sunday', 'SunShort', 'Sun'], ['Monday', 'MonShort', 'Mon'],
                    ['Tuesday', 'TueShort', 'Tue'], ['Wednesday', 'WedShort', 'Wed'],
                    ['Thursday', 'ThuShort', 'Thu'], ['Friday', 'FriShort', 'Fri'],
                    ['Saturday', 'SatShort', 'Sat']
                ];

                var page = document.querySelector('#ScheduledAccessConfigPage');
                var container = page.querySelector('#RulesContainer');
                var users = [];
                var libraries = [];
                var strings = {};
                // Las instantaneas NO se tocan desde aqui: son estado del servidor.
                // Reenviarlas desde el cliente destruiria el registro del estado
                // original de cada usuario. El servidor las preserva por su cuenta
                // en Plugin.UpdateConfiguration.

                function translate(key, fallback) {
                    return strings[key] || fallback;
                }

                function normalizeLanguage(tag) {
                    var base = String(tag || 'en').toLowerCase().split(/[-_]/)[0];
                    return SUPPORTED.indexOf(base) !== -1 ? base : SUPPORTED[0];
                }

                // Jellyfin guarda el idioma elegido en las preferencias del
                // usuario, pero solo si se fijo explicitamente. Si no esta,
                // el propio cliente web cae al idioma del navegador, y aqui
                // hacemos lo mismo para no contradecir a la interfaz.
                function detectLanguage() {
                    return ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby')
                        .then(function (prefs) {
                            var chosen = prefs && prefs.CustomPrefs && prefs.CustomPrefs.language;
                            return normalizeLanguage(chosen || navigator.language);
                        })
                        .catch(function () {
                            return normalizeLanguage(navigator.language);
                        });
                }

                function loadStrings(language) {
                    return ApiClient.ajax({
                        type: 'GET',
                        url: ApiClient.getUrl('web/ConfigurationPage', {
                            name: 'scheduledaccess.' + language + '.json'
                        }),
                        dataType: 'json'
                    }).catch(function () {
                        // Sin traducciones el HTML se queda en ingles, que es
                        // exactamente el comportamiento de respaldo buscado.
                        return {};
                    });
                }

                function applyTranslations(root) {
                    Array.prototype.forEach.call(
                        root.querySelectorAll('[data-localize]'),
                        function (el) {
                            var value = strings[el.getAttribute('data-localize')];
                            if (value) {
                                el.textContent = value;
                            }
                        });
                }

                function normalizeDays(days) {
                    if (!days) {
                        return [];
                    }
                    return days.map(function (d) {
                        return typeof d === 'number' ? DAY_KEYS[d][0] : d;
                    });
                }

                function normalizeMode(mode) {
                    if (typeof mode === 'number') {
                        return mode === 1 ? 'AllowOnly' : 'Block';
                    }
                    return mode || 'Block';
                }

                // <input type="time"> no admite 24:00, asi que el fin de dia se
                // representa como 00:00. No hay ambiguedad: el servidor trata
                // inicio == fin como dia completo, y 08:00-00:00 como "de las
                // ocho a medianoche", porque la franja cruza el limite del dia.
                function minutesToTime(value) {
                    var m = Math.max(0, Math.min(1440, parseInt(value, 10) || 0)) % 1440;
                    var h = Math.floor(m / 60);
                    return (h < 10 ? '0' : '') + h + ':' + ((m % 60) < 10 ? '0' : '') + (m % 60);
                }

                function timeToMinutes(value) {
                    var parts = String(value || '00:00').split(':');
                    var h = parseInt(parts[0], 10) || 0;
                    var m = parseInt(parts[1], 10) || 0;
                    return Math.max(0, Math.min(1439, (h * 60) + m));
                }

                // Los ItemId de las bibliotecas llegan sin guiones, pero tanto
                // XmlSerializer como System.Text.Json esperan el formato con
                // guiones al deserializar un Guid. Sin esto la regla se guarda
                // sin bibliotecas y en silencio.
                function toGuid(id) {
                    var s = String(id || '').replace(/-/g, '');
                    if (s.length !== 32) {
                        return String(id || '');
                    }
                    return s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) +
                        '-' + s.slice(16, 20) + '-' + s.slice(20);
                }

                function sameGuid(a, b) {
                    return String(a || '').replace(/-/g, '').toLowerCase() ===
                        String(b || '').replace(/-/g, '').toLowerCase();
                }

                function renderRule(rule) {
                    var row = document.createElement('div');
                    row.className = 'ScheduledAccessRule';
                    row.style.cssText = 'border:1px solid rgba(128,128,128,.4);border-radius:4px;padding:1em;margin-bottom:1em;';

                    var userOptions = users.map(function (u) {
                        var sel = u.Id === rule.UserId ? ' selected' : '';
                        return '<option value="' + u.Id + '"' + sel + '>' + u.Name + '</option>';
                    }).join('');

                    var selectedDays = normalizeDays(rule.Days);
                    var dayBoxes = DAY_KEYS.map(function (d) {
                        var checked = selectedDays.indexOf(d[0]) !== -1 ? ' checked' : '';
                        return '<label class="emby-checkbox-label" style="display:inline-block;margin-right:1em;">' +
                            '<input type="checkbox" is="emby-checkbox" class="ruleDay" value="' + d[0] + '"' + checked + ' />' +
                            '<span data-localize="' + d[1] + '">' + d[2] + '</span></label>';
                    }).join('');

                    var selectedLibraries = rule.LibraryIds || [];
                    var libraryBoxes = libraries.map(function (lib) {
                        var checked = selectedLibraries.some(function (id) {
                            return sameGuid(id, lib.ItemId);
                        }) ? ' checked' : '';
                        return '<label class="emby-checkbox-label" style="display:inline-block;margin-right:1em;">' +
                            '<input type="checkbox" is="emby-checkbox" class="ruleLibrary" value="' +
                            toGuid(lib.ItemId) + '"' + checked + ' />' +
                            '<span>' + lib.Name + '</span></label>';
                    }).join('');

                    var mode = normalizeMode(rule.Mode);

                    row.innerHTML =
                        '<div class="selectContainer">' +
                            '<label class="selectLabel" data-localize="User">User</label>' +
                            '<select is="emby-select" class="ruleUser emby-select-withcolor emby-select">' + userOptions + '</select>' +
                        '</div>' +
                        '<div style="margin:.5em 0 1em 0;">' + dayBoxes + '</div>' +
                        '<div class="inputContainer">' +
                            '<label class="inputLabel inputLabelUnfocused" data-localize="TimeSlot">Time slot</label>' +
                            '<div style="display:flex;gap:1em;align-items:center;">' +
                                '<span data-localize="From">From</span>' +
                                '<input type="time" is="emby-input" class="ruleStart" style="width:auto;" value="' +
                                    minutesToTime(rule.StartMinutes) + '" />' +
                                '<span data-localize="To">To</span>' +
                                '<input type="time" is="emby-input" class="ruleEnd" style="width:auto;" value="' +
                                    minutesToTime(rule.EndMinutes) + '" />' +
                            '</div>' +
                            '<div class="fieldDescription" data-localize="TimeSlotDescription">' +
                                'Leave both at 00:00 to cover the whole day. If the end is earlier than the start ' +
                                'the slot runs past midnight, and the checked day is the one it starts on. ' +
                                'When slots overlap, the shortest one wins.' +
                            '</div>' +
                        '</div>' +
                        '<div class="inputContainer">' +
                            '<label class="inputLabel inputLabelUnfocused" data-localize="Libraries">Libraries</label>' +
                            '<div style="margin:.5em 0;">' + libraryBoxes + '</div>' +
                            '<div class="fieldDescription" data-localize="LibrariesDescription">' +
                                'Check none to leave library access untouched. Check some and only those are ' +
                                'visible while the rule is active; tag filtering still applies inside them.' +
                            '</div>' +
                        '</div>' +
                        '<div class="selectContainer">' +
                            '<label class="selectLabel" data-localize="Mode">Mode</label>' +
                            '<select is="emby-select" class="ruleMode emby-select-withcolor emby-select">' +
                                '<option value="Block"' + (mode === 'Block' ? ' selected' : '') + ' data-localize="ModeBlock">Hide content with these tags</option>' +
                                '<option value="AllowOnly"' + (mode === 'AllowOnly' ? ' selected' : '') + ' data-localize="ModeAllowOnly">Show only content with these tags</option>' +
                            '</select>' +
                        '</div>' +
                        '<div class="inputContainer">' +
                            '<label class="inputLabel inputLabelUnfocused" data-localize="Tags">Tags (comma separated)</label>' +
                            '<input type="text" is="emby-input" class="ruleTags" value="' + (rule.Tags || []).join(', ') + '" />' +
                            '<div class="fieldDescription" data-localize="TagsDescription">' +
                                'In "show only" mode, anything without one of these tags is hidden.' +
                            '</div>' +
                        '</div>' +
                        '<button is="emby-button" type="button" class="raised removeRule emby-button">' +
                            '<span data-localize="Remove">Remove</span></button>';

                    row.querySelector('.removeRule').addEventListener('click', function () {
                        row.remove();
                    });

                    container.appendChild(row);
                    applyTranslations(row);
                }

                function collectRules() {
                    return Array.prototype.map.call(
                        container.querySelectorAll('.ScheduledAccessRule'),
                        function (row) {
                            var days = Array.prototype.filter
                                .call(row.querySelectorAll('.ruleDay'), function (c) { return c.checked; })
                                .map(function (c) { return c.value; });

                            var tags = row.querySelector('.ruleTags').value
                                .split(',')
                                .map(function (t) { return t.trim(); })
                                .filter(function (t) { return t.length > 0; });

                            var libraryIds = Array.prototype.filter
                                .call(row.querySelectorAll('.ruleLibrary'), function (c) { return c.checked; })
                                .map(function (c) { return c.value; });

                            return {
                                UserId: row.querySelector('.ruleUser').value,
                                Mode: row.querySelector('.ruleMode').value,
                                StartMinutes: timeToMinutes(row.querySelector('.ruleStart').value),
                                EndMinutes: timeToMinutes(row.querySelector('.ruleEnd').value),
                                Days: days,
                                Tags: tags,
                                LibraryIds: libraryIds
                            };
                        });
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();

                    detectLanguage()
                        .then(loadStrings)
                        .then(function (loaded) {
                            strings = loaded || {};
                            applyTranslations(page);
                            return ApiClient.getUsers();
                        })
                        .then(function (userList) {
                            users = userList;
                            return ApiClient.getVirtualFolders();
                        })
                        .then(function (folders) {
                            libraries = folders || [];
                            return ApiClient.getPluginConfiguration(pluginUniqueId);
                        })
                        .then(function (config) {
                            page.querySelector('#Enabled').checked = config.Enabled;

                            container.innerHTML = '';
                            (config.Rules || []).forEach(renderRule);

                            Dashboard.hideLoadingMsg();
                        });
                });

                page.querySelector('#AddRule').addEventListener('click', function () {
                    if (!users.length) {
                        return;
                    }
                    renderRule({
                        UserId: users[0].Id,
                        Mode: 'Block',
                        StartMinutes: 0,
                        EndMinutes: 0,
                        Days: [],
                        Tags: [],
                        LibraryIds: []
                    });
                });

                page.querySelector('#ScheduledAccessConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();

                    ApiClient.getPluginConfiguration(pluginUniqueId).then(function (config) {
                        config.Enabled = page.querySelector('#Enabled').checked;
                        config.Rules = collectRules();

                        ApiClient.updatePluginConfiguration(pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
